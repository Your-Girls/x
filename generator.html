<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Profile Generator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #4b5563;
            --border: #e5e7eb;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main);
            padding: 30px 20px; 
            line-height: 1.5;
        }
        
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); 
            border: 1px solid var(--border);
        }
        
        h1 { text-align: center; margin-bottom: 10px; font-size: 2rem; }
        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 0.95rem; }
        
        .section { margin-bottom: 30px; padding-bottom: 30px; border-bottom: 1px solid var(--border); }
        .section:last-of-type { border-bottom: none; padding-bottom: 10px; }
        
        h2 { font-size: 1.25rem; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        
        .form-group { margin-bottom: 15px; }
        
        label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        
        input { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid #d1d5db; 
            border-radius: 8px; 
            font-size: 1rem; 
            transition: all 0.2s;
            background-color: #f9fafb;
        }
        
        input:focus { 
            outline: none; 
            border-color: var(--primary); 
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); 
        }
        
        .item-card { 
            background: #f3f4f6; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #e5e7eb; 
        }
        .item-card h3 { font-size: 1.05rem; margin-bottom: 15px; color: #374151; }
        
        .btn-group { display: flex; gap: 15px; margin-top: 20px; }
        
        button { 
            flex: 1; 
            padding: 14px; 
            font-size: 1.05rem; 
            font-weight: 600; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            color: white; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s, background-color 0.2s; 
        }
        button:active { transform: scale(0.98); }
        
        .btn-generate { background: var(--primary); box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2); }
        .btn-generate:hover { background: var(--primary-hover); }
        
        .btn-reset { background: #ef4444; box-shadow: 0 4px 6px rgba(239, 68, 68, 0.2); }
        .btn-reset:hover { background: #dc2626; }
        
        /* Toast Notification */
        #toast {
            visibility: hidden; min-width: 250px; background-color: #10b981; color: #fff;
            text-align: center; border-radius: 8px; padding: 12px; position: fixed;
            z-index: 1; left: 50%; bottom: 30px; transform: translateX(-50%);
            font-weight: 500; opacity: 0; transition: opacity 0.3s, visibility 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; }
        
        @media (max-width: 600px) {
            .btn-group { flex-direction: column; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚙️ Web Profile Generator</h1>
        <p class="subtitle">Fill the data below to automatically generate your custom HTML profile.</p>
        
        <form id="generatorForm">
            <!-- Profile Info Section -->
            <div class="section">
                <h2>👤 Profile Information</h2>
                <div class="form-group">
                    <label>Profile Name</label>
                    <input type="text" id="profName" placeholder="e.g. John Doe" required>
                </div>
                <div class="form-group">
                    <label>Profile Description</label>
                    <input type="text" id="profDesc" placeholder="e.g. Digital Content Creator" required>
                </div>
                <div class="form-group">
                    <label>Profile Image URL</label>
                    <input type="url" id="profImg" placeholder="https://..." required>
                </div>
            </div>

            <!-- Items Section -->
            <div class="section" id="itemsSection">
                <h2>🎬 Content Items (4 Items)</h2>
                <!-- JavaScript will generate 4 boxes here -->
            </div>

            <!-- Action Buttons -->
            <div class="btn-group">
                <button type="button" class="btn-generate" onclick="generateHTML()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Generate & Download HTML
                </button>
                <button type="button" class="btn-reset" onclick="resetData()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                    Reset Data
                </button>
            </div>
        </form>
    </div>

    <!-- Toast Notification -->
    <div id="toast">HTML File Downloaded Successfully!</div>

    <script>
        // 1. Generate 4 Content Input Boxes dynamically
        const itemsSection = document.getElementById('itemsSection');
        for(let i=1; i<=4; i++) {
            itemsSection.innerHTML += `
                <div class="item-card">
                    <h3>Item ${i}</h3>
                    <div class="form-group">
                        <label>Thumbnail Image URL</label>
                        <input type="url" id="thumb${i}" placeholder="https://..." required>
                    </div>
                    <div class="form-group">
                        <label>Content Title</label>
                        <input type="text" id="title${i}" placeholder="Title for item ${i}" required>
                    </div>
                    <div class="form-group">
                        <label>Target URL</label>
                        <input type="url" id="url${i}" placeholder="https://..." required>
                    </div>
                </div>
            `;
        }

        const allInputs = document.querySelectorAll('input');

        // 2. Auto Save to LocalStorage on typing
        allInputs.forEach(input => {
            input.addEventListener('input', () => {
                localStorage.setItem(input.id, input.value);
            });
        });

        // 3. Load from LocalStorage on Page Load
        window.onload = () => {
            allInputs.forEach(input => {
                if(localStorage.getItem(input.id)) {
                    input.value = localStorage.getItem(input.id);
                }
            });
        };

        // 4. Reset Data Function
        function resetData() {
            if(confirm("Are you sure you want to clear all data? This cannot be undone.")) {
                localStorage.clear();
                document.getElementById('generatorForm').reset();
            }
        }

        // 5. Show Toast Notification
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // 6. Generate and Download HTML Logic
        function generateHTML() {
            const name = document.getElementById('profName').value || 'My Profile';
            const desc = document.getElementById('profDesc').value || 'Content Creator';
            const img = document.getElementById('profImg').value || 'https://via.placeholder.com/150';
            
            // Build Content Items HTML
            let contentHTML = '';
            for(let i=1; i<=4; i++) {
                let thumb = document.getElementById('thumb'+i).value || 'https://via.placeholder.com/600x338';
                let title = document.getElementById('title'+i).value || `Content Title ${i}`;
                let url = document.getElementById('url'+i).value || '#';

                contentHTML += `
            <!-- Item ${i} -->
            <a href="${url}" class="content-link target-link" target="_blank" rel="noopener noreferrer">
                <div class="content-item">
                    <div class="thumbnail-container">
                        <img src="${thumb}" alt="Thumbnail ${i}" class="thumbnail-img">
                        <div class="lock-overlay">
                            <svg class="lock-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            <div class="unlock-btn">Sign up to open (FREE)</div>
                        </div>
                    </div>
                    <h3 class="content-title">${title}</h3>
                </div>
            </a>`;
            }

            // The main HTML Template that gets downloaded
            const template = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${name} - Premium Profile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 40px 20px; }
        .profile-card { width: 100%; max-width: 500px; background-color: #ffffff; border-radius: 16px; border: 1px solid #e5e7eb; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); padding: 32px 24px; }
        .profile-info { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid #f3f4f6; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .profile-text h1 { font-size: 1.25rem; color: #111827; font-weight: 700; margin-bottom: 4px; }
        .profile-text p { font-size: 0.9rem; color: #6b7280; }
        .content-list { display: flex; flex-direction: column; gap: 28px; }
        .content-link { text-decoration: none; display: block; }
        .content-item { display: flex; flex-direction: column; gap: 12px; }
        .thumbnail-container { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background-color: #111827; cursor: pointer; }
        .thumbnail-img { width: 100%; height: 100%; object-fit: cover; filter: blur(6px) brightness(0.65); transform: scale(1.05); transition: all 0.3s ease; }
        .thumbnail-container:hover .thumbnail-img { filter: blur(4px) brightness(0.5); }
        .lock-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #ffffff; z-index: 2; }
        .lock-icon { width: 36px; height: 36px; stroke: #ffffff; opacity: 0.9; }
        .unlock-btn { font-size: 0.85rem; font-weight: 600; letter-spacing: 0.5px; background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .content-title { font-size: 1.05rem; color: #1f2937; font-weight: 600; line-height: 1.4; }
        #adblock-warning { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); color: white; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        #adblock-warning h2 { margin-bottom: 15px; color: #ff4b4b; }
        #adblock-warning p { font-size: 1.1rem; line-height: 1.5; }
        @media (max-width: 380px) { .profile-info { flex-direction: column; text-align: center; } }
    </style>
</head>
<body>

    <!-- Ad-Block Warning Screen -->
    <div id="adblock-warning">
        <h2>⚠️ Ad-Blocker Detected!</h2>
        <p>Please disable your Ad-Blocker extension to access this content.<br>Refresh the page after disabling it.</p>
    </div>

    <div class="profile-card">
        
        <div class="profile-info">
            <img src="${img}" alt="Profile Picture" class="profile-avatar">
            <div class="profile-text">
                <h1>${name}</h1>
                <p>${desc}</p>
            </div>
        </div>

        <div class="content-list">
            ${contentHTML}
        </div>
    </div>

    <!-- Functional Scripts Embedded into Exported File -->
    <script>
        // --- 1. IN-APP BROWSER DETECTION ---
        document.addEventListener("DOMContentLoaded", function() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isInAppBrowser = (userAgent.indexOf("FBAN") > -1) || 
                                   (userAgent.indexOf("FBAV") > -1) || 
                                   (userAgent.indexOf("Instagram") > -1) || 
                                   (userAgent.indexOf("Line") > -1);
            
            const links = document.querySelectorAll('.target-link');

            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    if (isInAppBrowser) {
                        const isAndroid = /android/i.test(userAgent);
                        if (isAndroid) {
                            e.preventDefault();
                            // Fix URL structure for Intent parsing
                            let rawUrl = this.href.replace(/^https?:\\/\\//, '');
                            window.location.href = \`intent://\${rawUrl}#Intent;scheme=https;package=com.android.chrome;end\`;
                        } else {
                            e.preventDefault();
                            alert("💡 To open this content, please tap the 3-dot icon in the corner of the screen and select 'Open in Browser' or 'Open in Safari'.");
                        }
                    }
                });
            });
        });

        // --- 2. HYBRID AD-BLOCKER DETECTION ---
        async function detectAdBlock() {
            let isBlocked = false;

            try {
                await fetch(new Request("https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js", {
                    method: 'HEAD', mode: 'no-cors', cache: 'no-store'
                }));
            } catch (error) {
                isBlocked = true; 
            }

            if (!isBlocked) {
                const adTest = document.createElement('div');
                adTest.innerHTML = '&nbsp;';
                adTest.className = 'adsbox ad-placement doubleclick ad-banner sponsor-ads'; 
                adTest.style.position = 'absolute';
                adTest.style.top = '-9999px';
                adTest.style.height = '10px';
                document.body.appendChild(adTest);
                
                await new Promise(resolve => setTimeout(resolve, 150));

                if (adTest.offsetHeight === 0 || window.getComputedStyle(adTest).display === 'none') {
                    isBlocked = true;
                }
                adTest.remove();
            }

            if (isBlocked) {
                document.getElementById('adblock-warning').style.display = 'flex';
                document.body.style.overflow = 'hidden'; 
            }
        }

        window.onload = detectAdBlock;
    <\/script>
</body>
</html>`;
            
            // Format Filename: "aa bb" -> "aa-bb.html"
            let formattedName = name.trim().toLowerCase().replace(/\s+/g, '-');
            if(!formattedName) formattedName = "my-profile";
            const filename = formattedName + '.html';

            // Create Blob and Download
            const blob = new Blob([template], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            showToast(`✅ File ${filename} generated!`);
        }
    </script>
</body>
</html>
