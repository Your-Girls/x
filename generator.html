<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Profile Generator</title>
    <style>
        :root { --primary: #4f46e5; --primary-hover: #4338ca; --bg: #f9fafb; --card-bg: #ffffff; --text-main: #111827; --text-muted: #4b5563; --border: #e5e7eb; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: var(--bg); color: var(--text-main); padding: 30px 20px; line-height: 1.5; }
        .container { max-width: 800px; margin: 0 auto; background: var(--card-bg); padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        h1 { text-align: center; margin-bottom: 10px; font-size: 2rem; }
        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 0.95rem; }
        .section { margin-bottom: 30px; padding-bottom: 30px; border-bottom: 1px solid var(--border); }
        .section:last-of-type { border-bottom: none; padding-bottom: 10px; }
        h2 { font-size: 1.25rem; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        input { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; transition: all 0.2s; background-color: #f9fafb; }
        input:focus { outline: none; border-color: var(--primary); background-color: #fff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        .item-card { background: #f3f4f6; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #e5e7eb; }
        .item-card h3 { font-size: 1.05rem; margin-bottom: 15px; color: #374151; }
        .btn-group { display: flex; gap: 15px; margin-top: 20px; }
        button { flex: 1; padding: 14px; font-size: 1.05rem; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.1s, background-color 0.2s; }
        button:active { transform: scale(0.98); }
        .btn-generate { background: var(--primary); box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2); }
        .btn-generate:hover { background: var(--primary-hover); }
        .btn-reset { background: #ef4444; box-shadow: 0 4px 6px rgba(239, 68, 68, 0.2); }
        .btn-reset:hover { background: #dc2626; }
        #toast { visibility: hidden; min-width: 250px; background-color: #10b981; color: #fff; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 1; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: 500; opacity: 0; transition: opacity 0.3s, visibility 0.3s; }
        #toast.show { visibility: visible; opacity: 1; }
        @media (max-width: 600px) { .btn-group { flex-direction: column; } .container { padding: 20px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Web Profile Generator</h1>
        <p class="subtitle">Fill the data below to automatically generate your custom HTML profile.</p>
        
        <form id="generatorForm">
            <div class="section">
                <h2>👤 Global Setup & Profile</h2>
                <div class="form-group">
                    <label>Global Target URL (One link applied to everything)</label>
                    <input type="url" id="globalUrl" placeholder="https://www.tiktok.com/..." required>
                </div>
                <div class="form-group">
                    <label>Profile Name</label>
                    <input type="text" id="profName" placeholder="e.g. John Doe" required>
                </div>
                <div class="form-group">
                    <label>Profile Description</label>
                    <input type="text" id="profDesc" placeholder="e.g. Digital Content Creator" required>
                </div>
                <div class="form-group">
                    <label>Profile Image URL</label>
                    <input type="url" id="profImg" placeholder="https://..." required>
                </div>
            </div>

            <div class="section" id="itemsSection">
                <h2>🎬 Content Items (4 Items)</h2>
            </div>

            <div class="btn-group">
                <button type="button" class="btn-generate" onclick="generateHTML()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Generate & Download HTML
                </button>
                <button type="button" class="btn-reset" onclick="resetData()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                    Reset Data
                </button>
            </div>
        </form>
    </div>

    <div id="toast">HTML File Downloaded Successfully!</div>

    <script>
        const itemsSection = document.getElementById('itemsSection');
        for(let i=1; i<=4; i++) {
            itemsSection.innerHTML += `
                <div class="item-card">
                    <h3>Item ${i}</h3>
                    <div class="form-group">
                        <label>Thumbnail Image URL</label>
                        <input type="url" id="thumb${i}" placeholder="https://..." required>
                    </div>
                    <div class="form-group">
                        <label>Content Title</label>
                        <input type="text" id="title${i}" placeholder="Title for item ${i}" required>
                    </div>
                </div>
            `;
        }

        const allInputs = document.querySelectorAll('input');

        allInputs.forEach(input => {
            input.addEventListener('input', () => {
                localStorage.setItem(input.id, input.value);
            });
        });

        window.onload = () => {
            allInputs.forEach(input => {
                if(localStorage.getItem(input.id)) {
                    input.value = localStorage.getItem(input.id);
                }
            });
        };

        function resetData() {
            if(confirm("Are you sure you want to clear all data? This cannot be undone.")) {
                localStorage.clear();
                document.getElementById('generatorForm').reset();
            }
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function generateHTML() {
            const globalUrl = document.getElementById('globalUrl').value || '#';
            const name = document.getElementById('profName').value || 'My Profile';
            const desc = document.getElementById('profDesc').value || 'Content Creator';
            const img = document.getElementById('profImg').value || 'https://via.placeholder.com/150';
            
            let contentHTML = '';
            for(let i=1; i<=4; i++) {
                let thumb = document.getElementById('thumb'+i).value || 'https://via.placeholder.com/600x338';
                let title = document.getElementById('title'+i).value || `Content Title ${i}`;

                contentHTML += `
            <!-- Item ${i} -->
            <a href="${globalUrl}" class="content-link target-link" target="_blank" rel="noopener noreferrer">
                <div class="content-item">
                    <div class="thumbnail-container">
                        <img src="${thumb}" alt="Thumbnail ${i}" class="thumbnail-img">
                        <div class="lock-overlay">
                            <svg class="lock-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            <div class="unlock-btn">Sign up to open (FREE)</div>
                        </div>
                    </div>
                    <h3 class="content-title">${title}</h3>
                </div>
            </a>`;
            }

            const template = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${name} - Premium Profile</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 40px 20px; }
    .profile-card { width: 100%; max-width: 500px; background-color: #ffffff; border-radius: 16px; border: 1px solid #e5e7eb; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); padding: 32px 24px; }
    .profile-info { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid #f3f4f6; transition: transform 0.2s; cursor: pointer; }
    .profile-info:hover { transform: scale(1.02); }
    .profile-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    
    /* Modifikasi H1 untuk Live & Blue Tick */
    .profile-text h1 { 
        font-size: 1.25rem; color: #111827; font-weight: 700; margin-bottom: 4px;
        display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    
    /* Animasi & Badge Live */
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
        70% { box-shadow: 0 0 0 4px rgba(255, 255, 255, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
    }
    .live-badge {
        background: #e50914; color: white; font-size: 0.65rem; font-weight: 800; 
        padding: 2px 6px; border-radius: 4px; letter-spacing: 0.5px; 
        display: flex; align-items: center; gap: 4px;
    }
    .live-dot {
        width: 6px; height: 6px; background: white; border-radius: 50%; 
        display: inline-block; animation: pulse 1.5s infinite;
    }
    .verified-tick {
        width: 18px; height: 18px; fill: #1da1f2; flex-shrink: 0;
    }

    .profile-text p { font-size: 0.9rem; color: #6b7280; }
    .content-list { display: flex; flex-direction: column; gap: 28px; }
    .content-link { text-decoration: none; display: block; color: inherit; }
    .content-item { display: flex; flex-direction: column; gap: 12px; }
    .thumbnail-container { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background-color: #111827; cursor: pointer; }
    .thumbnail-img { width: 100%; height: 100%; object-fit: cover; filter: blur(6px) brightness(0.65); transform: scale(1.05); transition: all 0.3s ease; }
    .thumbnail-container:hover .thumbnail-img { filter: blur(4px) brightness(0.5); }
    .lock-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #ffffff; z-index: 2; }
    .lock-icon { width: 36px; height: 36px; stroke: #ffffff; opacity: 0.9; }
    .unlock-btn { font-size: 0.85rem; font-weight: 600; letter-spacing: 0.5px; background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .content-title { font-size: 1.05rem; color: #1f2937; font-weight: 600; line-height: 1.4; }
    @media (max-width: 380px) { 
        .profile-info { flex-direction: column; text-align: center; } 
        .profile-text h1 { justify-content: center; }
    }
</style>
</head>
<body>

<div class="profile-card">
    <a href="${globalUrl}" class="content-link target-link" target="_blank" rel="noopener noreferrer">
        <div class="profile-info">
            <img src="${img}" alt="Profile Picture" class="profile-avatar">
            <div class="profile-text">
                <h1>
                    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
                    ${name}
                    <svg class="verified-tick" viewBox="0 0 24 24"><path d="M22.5 12.5l-1.58 1.92.51 2.43-2.45.45-1.18 2.19-2.39-.75-1.92 1.58-1.92-1.58-2.39.75-1.18-2.19-2.45-.45.51-2.43-1.58-1.92 1.58-1.92-.51-2.43 2.45-.45 1.18-2.19 2.39.75 1.92-1.58 1.92 1.58 2.39-.75 1.18 2.19 2.45.45-.51 2.43 1.58 1.92z"/><path d="M10.5 17L6 12.5l1.41-1.41L10.5 14.17l7.59-7.59L19.5 8l-9 9z" fill="#fff"/></svg>
                </h1>
                <p>${desc}</p>
            </div>
        </div>
    </a>

    <div class="content-list">
        ${contentHTML}
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isInAppBrowser = /FBAN|FBAV|Instagram|TikTok|Line|Twitter|Threads/i.test(ua);
        const isAndroid = /android/i.test(ua);
        const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
        
        if (isInAppBrowser) {
            let targetHref = "${globalUrl}";
            let parsedUrl;
            try {
                parsedUrl = new URL(targetHref);
            } catch(e) {
                parsedUrl = new URL("https://" + targetHref.replace(/^https?:\\/\\//, ''));
            }
            
            let intentTarget = parsedUrl.host + parsedUrl.pathname + parsedUrl.search;
            let normalHref = parsedUrl.href;
            let fallbackEncoded = encodeURIComponent(normalHref);
            
            let actionHTML = '';
            if (isAndroid) {
                const intentUrl = "intent://" + intentTarget + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + fallbackEncoded + ";end";
                actionHTML = '<a href="' + intentUrl + '" class="ia-btn primary">Continue</a>';
            } else if (isIOS) {
                actionHTML = '<span style="font-size:13px; color:#666; text-align:right; font-weight:600;">Tap <b>...</b> (menu)<br>Open in Safari</span>';
            } else {
                actionHTML = '<a href="' + normalHref + '" class="ia-btn primary">Continue</a>';
            }
            
            const sheetCSS = '<style>' +
                '.ia-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:999998;display:flex;align-items:flex-end;justify-content:center}' +
                '.ia-sheet{width:100%;max-width:600px;background:#fff;border-radius:20px 20px 0 0;padding:25px 20px;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;box-shadow:0 -4px 15px rgba(0,0,0,0.1);animation:slideUp 0.3s ease-out forwards}' +
                '@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}' +
                '.ia-header{text-align:center;font-size:17px;font-weight:700;color:#050505;padding-bottom:15px;border-bottom:1px solid #ced0d4;margin-bottom:20px}' +
                '.ia-row{display:flex;align-items:center;justify-content:space-between}' +
                '.ia-left{display:flex;align-items:center;gap:15px}' +
                '.ia-icon{width:42px;height:42px}' +
                '.ia-text{font-size:16px;font-weight:600;color:#050505}' +
                '.ia-btn{background:#e4e6eb;color:#050505;font-size:15px;font-weight:600;padding:10px 24px;border-radius:24px;text-decoration:none;transition:0.2s}' +
                '.ia-btn.primary{background:#0866ff;color:#fff}' +
            '</style>';
            
            const sheetHTML = '' +
            '<div class="ia-overlay">' +
                '<div class="ia-sheet">' +
                    '<div class="ia-header">Open in Browser...</div>' +
                    '<div class="ia-row">' +
                        '<div class="ia-left">' +
                            '<svg class="ia-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">' +
                                '<path d="M24 10C16.27 10 10 16.27 10 24C10 31.73 16.27 38 24 38C31.73 38 38 31.73 38 24C38 16.27 31.73 10 24 10ZM24 13.5C28.42 13.5 32.2 16.23 33.72 20H16.24C17.97 16.03 21.84 13.5 24 13.5ZM13.88 26.5C13.62 25.7 13.5 24.87 13.5 24C13.5 22.18 14.04 20.48 14.97 19.06L23.75 34.27C18.66 33.84 14.63 30.64 13.88 26.5ZM24 28.5C21.51 28.5 19.5 26.49 19.5 24C19.5 21.51 21.51 19.5 24 19.5C26.49 19.5 28.5 21.51 28.5 24C28.5 26.49 26.49 28.5 24 28.5ZM24.47 34.48L17.7 22.75H32.48C32.8 24.08 33.15 25.5 33.15 27C33.15 31.06 29.83 34.39 25.7 34.48C25.29 34.49 24.88 34.49 24.47 34.48ZM34.27 24C34.27 25.13 34.07 26.21 33.7 27.21L26.31 14.43C30.93 15.65 34.27 19.45 34.27 24Z" fill="#4285F4"/>' +
                                '<path d="M24 19.5C21.51 19.5 19.5 21.51 19.5 24C19.5 26.49 21.51 28.5 24 28.5C26.49 28.5 28.5 26.49 28.5 24C28.5 21.51 26.49 19.5 24 19.5Z" fill="#FFFFFF"/>' +
                            '</svg>' +
                            '<span class="ia-text">Chrome / Browser</span>' +
                        '</div>' +
                        actionHTML +
                    '</div>' +
                '</div>' +
            '</div>';
            
            document.body.style.overflow = 'hidden';
            document.body.insertAdjacentHTML('beforeend', sheetCSS + sheetHTML);
        }
    });
<\/script>
</body>
</html>`;
            
            let formattedName = name.trim().toLowerCase().replace(/\s+/g, '-');
            if(!formattedName) formattedName = "my-profile";
            const filename = formattedName + '.html';

            const blob = new Blob([template], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            showToast(`✅ File ${filename} generated!`);
        }
    </script>
</body>
</html>
